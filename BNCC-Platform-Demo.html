                                            <button class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg font-semibold text-sm hover:bg-gray-300 transition-all">
                                                Saiba Mais →
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Load More -->
                        <div class="text-center mt-12">
                            <button class="px-8 py-3 bg-purple-600 text-white rounded-lg font-bold hover-lift">
                                Carregar Mais Experiências
                            </button>
                        </div>
                    </div>
                </div>
            `
        };

        function navigate(page) {
            const content = pages[page] ? pages[page]() : pages.home();
            app.innerHTML = content;
        }

        // Iniciar com página home
        navigate('home');
    </script>
</body>
</html>
